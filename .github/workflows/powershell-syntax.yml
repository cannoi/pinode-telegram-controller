
name: PowerShell Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    name: Check PowerShell syntax
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell files
        shell: pwsh
        run: |
          $errors = 0

          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
            Where-Object {
              $_.FullName -notmatch '\\(node_modules|__pycache__|\.git)\\'
            } |
            ForEach-Object {
              Write-Host "Checking $($_.FullName)"

              $tokens = $null
              $parseErrors = $null

              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseErrors
              ) | Out-Null

              if ($parseErrors.Count -gt 0) {
                $errors += $parseErrors.Count

                foreach ($error in $parseErrors) {
                  Write-Host "ERROR: $($_.FullName)"
                  Write-Host $error.Message
                }
              }
            }

          if ($errors -gt 0) {
            throw "$errors PowerShell syntax error(s) found."
          }

          Write-Host "PowerShell syntax check PASSED."
