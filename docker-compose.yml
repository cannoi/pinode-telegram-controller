services:
  pinode-controller:
    image: ghcr.io/cannoi/pinode-telegram-controller:latest
    container_name: pinode-telegram-controller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATA_DIR: /data
      LOG_DIR: /data/logs
      STATE_DIR: /data/state
      HISTORY_FILE: /data/node_history.json
      CHAT_HISTORY_FILE: /data/chat_history.json
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PI_NODE_HOST: ${PI_NODE_HOST:-host.docker.internal}
      PI_NODE_PORTS: ${PI_NODE_PORTS:-31401,31402,31403}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      MONITOR_INTERVAL_MINUTES: ${MONITOR_INTERVAL_MINUTES:-60}
      PROBLEM_RESCAN_MINUTES: ${PROBLEM_RESCAN_MINUTES:-10}
      DAILY_REPORT_HOURS: ${DAILY_REPORT_HOURS:-7,18}
      RAM_ALERT: ${RAM_ALERT:-88}
      CPU_ALERT: ${CPU_ALERT:-90}
      TEMP_ALERT: ${TEMP_ALERT:-78}
      INCOMING_LOW: ${INCOMING_LOW:-3}
      AUTO_RESET_ON_FAIL: ${AUTO_RESET_ON_FAIL:-false}
      PROBLEM_STREAK_BEFORE_RESET: ${PROBLEM_STREAK_BEFORE_RESET:-3}
    volumes:
      - pinode_data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  pinode_data:
    name: pinode-telegram-controller-data
